openapi: 3.0.3
info:
  title: Retirement Cash Flow Simulator API
  version: 1.2.0
  description: |
    The API the frontend calls, served by the Deno BFF, which forwards each request to the Kotlin API
    server unchanged. The schemas mirror the Kotlin @Serializable models (api-server/.../model), from which
    frontend/src/types/contract.generated.ts and backend/src/contract.generated.ts are generated.

    Units: rates are decimals (0.03 = 3%), except one-time loan `aprPercent` (5 = 5%). Money is in dollars.

    Errors are always JSON:
    - 400 malformed or incomplete request body (missing required field)
    - 422 invalid input, with per-field errors (ValidationErrorResponse)
    - 404 unknown saved simulation or route (ErrorResponse)
    - 503 the BFF cannot reach the API server
    - 500 anything else (ErrorResponse)
servers:
  - url: http://localhost:8000
    description: Deno BFF (forwards to the Kotlin API server on port 8090)

paths:
  /api/simulate:
    post:
      summary: Run a single interactive simulation
      description: |
        Uses the config's static rates. If `marketPresetId` names a preset with a return sequence
        (e.g. `crash-2008`), that sequence replaces the equity return of the first retirement years.
      operationId: runSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationConfig' }
      responses:
        '200':
          description: Successful simulation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/simulate/breakdown:
    post:
      summary: Computation breakdown for one year of an interactive simulation (spec 004)
      operationId: getBreakdown
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BreakdownRequest' }
      responses:
        '200':
          description: The breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearBreakdown' }
        '400':
          description: Malformed request, or the target age is not in the simulation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/market-presets:
    get:
      summary: Preset market conditions (FR002-003)
      operationId: getMarketPresets
      responses:
        '200':
          description: The presets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketPreset' }

  /api/spending-strategies:
    get:
      summary: The retirement spending strategies a simulation can select (spec 006, FR006-002)
      operationId: getSpendingStrategies
      responses:
        '200':
          description: The strategy catalog; the first entry is the default
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SpendingStrategyInfo' }

  /api/simulate/monte-carlo:
    post:
      summary: Run a Monte Carlo analysis (US002-3)
      description: |
        Runs the simulation `runs` times. Each run draws its own sequence of equity returns and inflation
        (historical bootstrap re-centred on the configured rates) and bond yields; everything else comes
        from the config. Run i always uses the scenario generated from (seed, i), so the same request
        returns the same result. Only summaries are returned; use /api/simulate/monte-carlo/run for a
        run's full results.
      operationId: runMonteCarlo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonteCarloRequest' }
      responses:
        '200':
          description: Monte Carlo results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonteCarloResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/simulate/monte-carlo/run:
    post:
      summary: Full details of one Monte Carlo run (US002-4 "Load Details")
      operationId: getMonteCarloRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonteCarloRunRequest' }
      responses:
        '200':
          description: The run's variables, summary and full simulation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonteCarloRunDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/simulate/monte-carlo/run/breakdown:
    post:
      summary: Computation breakdown for one year of one Monte Carlo run (spec 004 US004-6)
      description: |
        Rebuilds the run from the analysis seed and run index, as /api/simulate/monte-carlo/run does, and explains
        the requested year with the run's own sampled equity returns, inflation and bond yields.
      operationId: getMonteCarloRunBreakdown
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonteCarloRunBreakdownRequest' }
      responses:
        '200':
          description: The breakdown, attributed to the run (equityReturnSource MONTE_CARLO_SCENARIO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearBreakdown' }
        '400':
          description: Malformed request, or the target age is not in the simulation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/simulations:
    get:
      summary: List saved simulations, most recently changed first (FR002-012, FR005-011)
      operationId: listSimulations
      responses:
        '200':
          description: Saved simulations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedSimulationSummary' }
    post:
      summary: Save a simulation's inputs and results under a name (FR002-011)
      operationId: saveSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSimulationRequest' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSimulationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: The name is blank or longer than 255 characters (field `name`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

  /api/simulations/{id}:
    get:
      summary: Load a saved simulation (FR002-013)
      operationId: getSimulation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The saved simulation, exactly as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSimulation' }
        '400':
          description: The id is not a UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No saved simulation with this id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      summary: Replace a saved simulation's inputs and results, keeping its name (FR005-007)
      operationId: updateSimulation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSimulationRequest' }
      responses:
        '200':
          description: Updated; `updatedAt` is set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSimulationSummary' }
        '400': { description: The id is not a UUID, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: No saved simulation with this id, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    patch:
      summary: Rename a saved simulation (FR005-008)
      operationId: renameSimulation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameSimulationRequest' }
      responses:
        '200':
          description: Renamed; nothing else changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSimulationSummary' }
        '400': { description: The id is not a UUID, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: No saved simulation with this id, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422':
          description: The name is blank or longer than 255 characters (field `name`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
    delete:
      summary: Delete a saved simulation permanently (FR005-009)
      operationId: deleteSimulation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '400': { description: The id is not a UUID, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: No saved simulation with this id, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/inputs/export:
    post:
      summary: A simulation's inputs as an inputs file (FR005-013)
      operationId: exportInputs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationConfig' }
      responses:
        '200':
          description: The inputs file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InputsFile' }
        '422':
          description: Invalid inputs, with the same field errors as /api/simulate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

  /api/inputs/import:
    post:
      summary: Check an inputs file and return its inputs, with defaults for missing optional fields (FR005-014 to FR005-017)
      operationId: importInputs
      requestBody:
        required: true
        description: The file's content. The BFF refuses bodies over 1 MB with 413.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InputsFile' }
      responses:
        '200':
          description: The file's inputs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationConfig' }
        '400':
          description: Not an inputs file (not JSON, wrong or missing format, newer format version, unreadable inputs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Invalid inputs, every field at once, the same as /api/simulate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

components:
  responses:
    BadRequest:
      description: The body is not valid JSON or is missing a required field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: Invalid input; every problem is listed with its field path
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
    Unavailable:
      description: The BFF cannot reach the API server
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # --- Inputs ---

    SimulationConfig:
      type: object
      required: [name, currentYear, currentAge, retirementAge, salary, portfolio, spousal, expenses, contributions, rates, strategy]
      properties:
        id: { type: string, nullable: true }
        name: { type: string }
        currentYear: { type: integer, minimum: 1900, maximum: 2200 }
        currentAge: { type: integer, minimum: 18, maximum: 109 }
        retirementAge: { type: integer, minimum: 18, maximum: 110 }
        endAge:
          type: integer
          default: 85
          maximum: 110
          description: Age the simulation runs through (FR002-001a); must be greater than currentAge
        salary: { type: number, minimum: 0 }
        portfolio: { $ref: '#/components/schemas/Portfolio' }
        spousal: { $ref: '#/components/schemas/SpousalDetails' }
        expenses: { $ref: '#/components/schemas/ExpenseConfig' }
        contributions: { $ref: '#/components/schemas/ContributionConfig' }
        rates: { $ref: '#/components/schemas/RateConfig' }
        strategy: { $ref: '#/components/schemas/StrategyConfig' }
        oneTimeExpenses:
          type: array
          default: []
          items: { $ref: '#/components/schemas/OneTimeExpense' }
        marketPresetId:
          type: string
          nullable: true
          default: null
          description: Id of the MarketPreset the rates came from; null means custom market conditions

    Portfolio:
      type: object
      required: [sb, cbb, tba, tda, tfa]
      properties:
        sb: { type: number, minimum: 0, description: Spend Bucket (HYSA) }
        cbb: { type: number, minimum: 0, description: Crash Buffer Bucket (bonds) }
        tba: { type: number, minimum: 0, description: Taxable brokerage }
        tda: { type: number, minimum: 0, description: Tax-deferred }
        tfa: { type: number, minimum: 0, description: Tax-free }

    SpousalDetails:
      type: object
      required: [spouseAge, lowerEarner, higherEarner]
      properties:
        spouseAge: { type: integer, minimum: 18, maximum: 110 }
        lowerEarner: { $ref: '#/components/schemas/SocialSecurityDetails' }
        higherEarner: { $ref: '#/components/schemas/SocialSecurityDetails' }

    SocialSecurityDetails:
      type: object
      required: [claimAge, annualBenefit]
      properties:
        claimAge: { type: integer, minimum: 62, maximum: 70 }
        annualBenefit: { type: number, minimum: 0 }

    ExpenseConfig:
      type: object
      required: [needs, wants, propertyTax, healthcarePreRetirement, healthcarePostRetirementPreMedicare, healthcareMedicare]
      properties:
        needs: { type: number, minimum: 0 }
        wants: { type: number, minimum: 0 }
        propertyTax: { type: number, minimum: 0 }
        healthcarePreRetirement: { type: number, minimum: 0 }
        healthcarePostRetirementPreMedicare: { type: number, minimum: 0 }
        healthcareMedicare: { type: number, minimum: 0 }

    ContributionConfig:
      type: object
      required: [annual401k, annualTba]
      properties:
        annual401k: { type: number, minimum: 0 }
        annualRoth: { type: number, minimum: 0, default: 0 }
        annualTba: { type: number, minimum: 0 }

    RateConfig:
      type: object
      required: [inflation, preRetirementGrowth, postRetirementGrowth, bondYield, hysaRate, incomeTax]
      properties:
        inflation: { type: number, minimum: -0.10, maximum: 0.25 }
        preRetirementGrowth: { type: number, minimum: -0.50, maximum: 0.50 }
        postRetirementGrowth: { type: number, minimum: -0.50, maximum: 0.50 }
        bondYield: { type: number, minimum: 0, maximum: 0.25 }
        hysaRate: { type: number, minimum: 0, maximum: 0.25 }
        incomeTax: { type: number, minimum: 0, maximum: 0.90 }

    StrategyConfig:
      type: object
      required: [initialTdaWithdrawal]
      properties:
        initialTdaWithdrawal: { type: number, description: Deprecated }
        tdaWithdrawalPercentage: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        rothConversionAmount: { type: number, default: 0, description: Deprecated }
        rothConversionPreRetirement: { type: number, minimum: 0, default: 0 }
        rothConversionPostRetirement: { type: number, minimum: 0, default: 0 }
        type:
          type: string
          default: PARTHA_V0_01_20250105
          description: A catalog id (GET /api/spending-strategies), e.g. RISK_BASED_GUARDRAILS_V1; otherwise 422 on strategy.type
        guardrails: { $ref: '#/components/schemas/GuardrailsSettings' }

    GuardrailsSettings:
      type: object
      description: |
        Risk-Based Guardrails settings (spec 006, FR006-009/FR006-010), kept when another strategy is selected.
        Checked only when strategy.type is RISK_BASED_GUARDRAILS_V1: 0.01 <= lowerGuardrail < targetSuccess <
        upperGuardrail <= 0.99, else 422 on the field that breaks it.
      properties:
        targetSuccess: { type: number, minimum: 0.01, maximum: 0.99, default: 0.9 }
        upperGuardrail: { type: number, minimum: 0.01, maximum: 0.99, default: 0.99 }
        lowerGuardrail: { type: number, minimum: 0.01, maximum: 0.99, default: 0.7 }
        reviewFrequency: { type: string, enum: [YEARLY, QUARTERLY], default: YEARLY }

    SpendingStrategyInfo:
      type: object
      required: [id, name, description, settings]
      properties:
        id: { type: string, description: Stable versioned identifier (FR006-006) }
        name: { type: string }
        description: { type: string }
        settings: { type: string, enum: [NONE, GUARDRAILS], description: Which form fields the strategy uses }

    OneTimeExpense:
      oneOf:
        - $ref: '#/components/schemas/CashExpense'
        - $ref: '#/components/schemas/LoanExpense'
      discriminator:
        propertyName: type
        mapping:
          CASH: '#/components/schemas/CashExpense'
          LOAN: '#/components/schemas/LoanExpense'

    CashExpense:
      type: object
      required: [type, id, name, amount, yearOrAge]
      properties:
        type: { type: string, enum: [CASH] }
        id: { type: string }
        name: { type: string, maxLength: 100 }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, description: "Today's dollars" }
        yearOrAge: { $ref: '#/components/schemas/YearOrAge' }

    LoanExpense:
      type: object
      required: [type, id, name, principal, aprPercent, termYears, startYearOrAge]
      properties:
        type: { type: string, enum: [LOAN] }
        id: { type: string }
        name: { type: string, maxLength: 100 }
        principal: { type: number, exclusiveMinimum: true, minimum: 0 }
        downPayment: { type: number, minimum: 0, default: 0 }
        aprPercent: { type: number, minimum: 0, maximum: 99.99, description: Whole-number percent (5 = 5%) }
        termYears: { type: integer, minimum: 1, maximum: 50 }
        startYearOrAge: { $ref: '#/components/schemas/YearOrAge' }
        quarterlyPayment: { type: number, nullable: true, description: Ignored; the server computes the payment }

    YearOrAge:
      oneOf:
        - type: object
          required: [type, year]
          properties:
            type: { type: string, enum: [YEAR] }
            year: { type: integer }
        - type: object
          required: [type, age]
          properties:
            type: { type: string, enum: [AGE] }
            age: { type: integer }
      discriminator:
        propertyName: type

    BreakdownRequest:
      type: object
      required: [config, targetAge]
      properties:
        config: { $ref: '#/components/schemas/SimulationConfig' }
        targetAge: { type: integer }

    MonteCarloRequest:
      type: object
      required: [config]
      properties:
        config: { $ref: '#/components/schemas/SimulationConfig' }
        runs: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
        seed:
          type: integer
          format: int64
          nullable: true
          description: Omit to have the server pick one (within JavaScript's safe integer range); the result returns it

    MonteCarloRunRequest:
      type: object
      required: [config, seed, runIndex]
      properties:
        config: { $ref: '#/components/schemas/SimulationConfig', description: The config the analysis was run with }
        seed: { type: integer, format: int64, description: The analysis seed (MonteCarloResult.seed) }
        runIndex: { type: integer, minimum: 0 }

    MonteCarloRunBreakdownRequest:
      type: object
      required: [config, seed, runIndex, targetAge]
      properties:
        config: { $ref: '#/components/schemas/SimulationConfig', description: The config the analysis was run with }
        seed: { type: integer, format: int64, description: The analysis seed (MonteCarloResult.seed) }
        runIndex: { type: integer, minimum: 0 }
        targetAge: { type: integer, description: The year to explain, as an age }

    SaveSimulationRequest:
      type: object
      required: [name, result]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, description: Trimmed before saving }
        result: { $ref: '#/components/schemas/SimulationResult' }

    # --- Results ---

    SimulationResult:
      type: object
      required: [config, yearlyResults, quarterlyResults, summary, apiMetadata]
      properties:
        config: { $ref: '#/components/schemas/SimulationConfig' }
        yearlyResults:
          type: array
          description: The start year snapshot, then one row per simulated year through End Age (or the failure year)
          items: { $ref: '#/components/schemas/YearlyResult' }
        quarterlyResults:
          type: array
          items: { $ref: '#/components/schemas/QuarterlyResult' }
        summary: { $ref: '#/components/schemas/Summary' }
        apiMetadata: { $ref: '#/components/schemas/ApiMetadata' }

    YearlyResult:
      type: object
      required: [year, age, balances, cashFlow, metrics, oneTimeExpensesBreakdown]
      properties:
        year: { type: integer }
        age: { type: integer }
        balances: { $ref: '#/components/schemas/Portfolio' }
        cashFlow: { $ref: '#/components/schemas/CashFlow' }
        metrics: { $ref: '#/components/schemas/Metrics' }
        oneTimeExpensesBreakdown:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ExpenseDetail' }
        market: { $ref: '#/components/schemas/MarketRates' }
        guardrails:
          allOf: [{ $ref: '#/components/schemas/YearGuardrails' }]
          nullable: true
          description: Risk-Based Guardrails retirement years only (spec 006, FR006-018)

    YearGuardrails:
      type: object
      required: [configuredWants, annualSpendingTodaysDollars, reviews]
      properties:
        configuredWants: { type: number, description: Configured Wants with this year's inflation; cashFlow.wants is the adjusted Wants }
        annualSpendingTodaysDollars: { type: number, description: Needs + Wants + healthcare + property tax, divided by cumulative inflation }
        reviews: { type: array, items: { $ref: '#/components/schemas/GuardrailReview' } }

    GuardrailReview:
      type: object
      description: One guardrail review at the start of a retirement quarter. Wants are dollars of the review year.
      required: [year, quarter, age, portfolioValue, probabilityBefore, outcome, wantsBefore, wantsAfter, spendingBefore, probabilityAfter]
      properties:
        year: { type: integer }
        quarter: { type: integer, minimum: 1, maximum: 4 }
        age: { type: integer }
        portfolioValue: { type: number }
        probabilityBefore: { type: number, minimum: 0, maximum: 1 }
        outcome: { type: string, enum: [NO_CHANGE, CUT, RAISE, RAISE_CAPPED, TARGET_UNREACHABLE] }
        wantsBefore: { type: number }
        wantsAfter: { type: number }
        spendingBefore: { type: number, description: The year's Needs + Wants + healthcare + property tax before the review }
        probabilityAfter: { type: number, minimum: 0, maximum: 1 }
        lowerGuardrailPortfolio: { type: number, nullable: true, description: Null in Monte Carlo batches (US006-3) }
        upperGuardrailPortfolio: { type: number, nullable: true, description: Null when no portfolio up to 10x reaches it, or in Monte Carlo batches }
        wantsAtLowerGuardrail: { type: number, nullable: true }
        wantsAtUpperGuardrail: { type: number, nullable: true }

    MarketRates:
      type: object
      nullable: true
      description: The year's applied rates, as decimals (FR002-009); null for the start-year snapshot and in older saved results
      required: [equityReturn, inflation, bondYield]
      properties:
        equityReturn: { type: number }
        inflation: { type: number }
        bondYield: { type: number }

    QuarterlyResult:
      type: object
      required: [year, quarter, age, balances, cashFlow, metrics]
      properties:
        year: { type: integer }
        quarter: { type: integer, minimum: 0, maximum: 3, description: 0 = Q1 }
        age: { type: integer }
        balances: { $ref: '#/components/schemas/Portfolio' }
        cashFlow: { $ref: '#/components/schemas/CashFlow' }
        metrics: { $ref: '#/components/schemas/Metrics' }
        market: { $ref: '#/components/schemas/MarketRates' }

    CashFlow:
      type: object
      description: Income and expenses for the period (year or quarter). See data-model.md for each field.
      required: [salary, interest, dividends, socialSecurity, tbaWithdrawal, tdaWithdrawal, tdaWithdrawalSpend,
        tdaWithdrawalRoth, tfaWithdrawal, sbDeposit, sbWithdrawal, rothConversion, contribution401k, contributionRoth,
        contributionTba, totalIncome, needs, wants, healthcare, incomeTax, propertyTax, totalExpenses, oneTimeExpenses]
      properties:
        salary: { type: number }
        interest: { type: number }
        dividends: { type: number }
        socialSecurity: { type: number }
        tbaWithdrawal: { type: number }
        tdaWithdrawal: { type: number, description: tdaWithdrawalSpend + tdaWithdrawalRoth }
        tdaWithdrawalSpend: { type: number }
        tdaWithdrawalRoth: { type: number }
        tfaWithdrawal: { type: number, description: "Tax Free withdrawals for spending, the last resort (#23); not taxed" }
        sbDeposit: { type: number }
        sbWithdrawal: { type: number }
        rothConversion: { type: number }
        contribution401k: { type: number }
        contributionRoth: { type: number }
        contributionTba: { type: number }
        totalIncome: { type: number }
        needs: { type: number }
        wants: { type: number }
        healthcare: { type: number }
        incomeTax: { type: number }
        propertyTax: { type: number }
        totalExpenses: { type: number }
        oneTimeExpenses: { type: number }

    Metrics:
      type: object
      required: [annualIncomeGap, incomeGapExpenses, incomeGapPassiveIncome, sbCap, cbbCap, isFailure]
      properties:
        annualIncomeGap: { type: number, nullable: true, description: null in working years and the start year }
        incomeGapExpenses: { type: number }
        incomeGapPassiveIncome: { type: number }
        sbCap: { type: number, nullable: true, description: null in working years }
        cbbCap: { type: number }
        isFailure: { type: boolean }

    ExpenseDetail:
      type: object
      required: [name, amount, type]
      properties:
        name: { type: string }
        amount: { type: number }
        type: { type: string, enum: [CASH, LOAN_PAYMENT] }

    Summary:
      type: object
      required: [finalTotalBalance, isSuccess, failureYear, totalDividends, totalInterest]
      properties:
        finalTotalBalance: { type: number }
        isSuccess: { type: boolean }
        failureYear: { type: integer, nullable: true }
        totalDividends: { type: number }
        totalInterest: { type: number }
        guardrails:
          allOf: [{ $ref: '#/components/schemas/GuardrailsSummary' }]
          nullable: true
          description: Risk-Based Guardrails only (spec 006, FR006-019)

    GuardrailsSummary:
      type: object
      required: [startingProbability, cuts, raises, largestCutPercent, lowestAnnualSpending, highestAnnualSpending, configuredSpendingUnreachable]
      properties:
        startingProbability: { type: number }
        startingLowerGuardrailPortfolio: { type: number, nullable: true }
        startingUpperGuardrailPortfolio: { type: number, nullable: true }
        cuts: { type: integer, description: CUT and TARGET_UNREACHABLE reviews }
        raises: { type: integer, description: RAISE and RAISE_CAPPED reviews }
        largestCutPercent: { type: number, nullable: true, description: (wantsBefore - wantsAfter) / spendingBefore }
        lowestAnnualSpending: { type: number, description: Today's dollars }
        highestAnnualSpending: { type: number, description: Today's dollars }
        configuredSpendingUnreachable: { type: boolean, description: The first review cut Wants }

    ApiMetadata:
      type: object
      required: [version, buildTime, serverStartTime]
      properties:
        version: { type: string }
        buildTime: { type: string }
        serverStartTime: { type: string }

    YearBreakdown:
      type: object
      description: |
        Computation breakdown for one year (spec 004): seven sections in the order the year happens. Section fields
        are null for the start-year snapshot (phase START) except startingPosition; nextYear is null in the last
        simulated year. Amounts are dollars of the year shown; rates are decimals. See specs/004-yearly-breakdown.
      required: [year, age, spouseAge, phase, isLastYear, startingPosition, expenses, income, incomeGap, moneyMovement, taxes, nextYear, apiMetadata]
      properties:
        year: { type: integer }
        age: { type: integer }
        spouseAge: { type: integer }
        phase: { type: string, enum: [START, WORKING, RETIREMENT] }
        isLastYear: { type: boolean }
        startingPosition: { $ref: '#/components/schemas/StartingPosition' }
        expenses: { allOf: [{ $ref: '#/components/schemas/ExpenseSection' }], nullable: true }
        income: { allOf: [{ $ref: '#/components/schemas/IncomeSection' }], nullable: true }
        incomeGap: { allOf: [{ $ref: '#/components/schemas/IncomeGapSection' }], nullable: true }
        moneyMovement: { allOf: [{ $ref: '#/components/schemas/MoneyMovementSection' }], nullable: true }
        taxes: { allOf: [{ $ref: '#/components/schemas/TaxSection' }], nullable: true }
        nextYear: { allOf: [{ $ref: '#/components/schemas/NextYearSection' }], nullable: true }
        guardrails: { allOf: [{ $ref: '#/components/schemas/GuardrailsSection' }], nullable: true, description: Risk-Based Guardrails retirement years only (spec 006) }
        apiMetadata: { $ref: '#/components/schemas/ApiMetadata' }

    GuardrailsSection:
      type: object
      description: A retirement year's guardrail reviews (spec 006, FR006-020). Which accounts paid is in moneyMovement.
      required: [targetSuccess, upperGuardrail, lowerGuardrail, reviewFrequency, reviews, configuredWants, adjustedWants]
      properties:
        targetSuccess: { type: number }
        upperGuardrail: { type: number }
        lowerGuardrail: { type: number }
        reviewFrequency: { type: string, enum: [YEARLY, QUARTERLY] }
        reviews: { type: array, items: { $ref: '#/components/schemas/GuardrailReview' } }
        configuredWants: { $ref: '#/components/schemas/LineItem' }
        adjustedWants: { $ref: '#/components/schemas/LineItem' }
        noReviewNote: { type: string, nullable: true, description: Quarterly reviews cut short by the plan failing }

    LineItem:
      type: object
      required: [label, amount, rule, inputs, todaysDollars]
      properties:
        label: { type: string }
        amount: { type: number }
        rule: { type: string, description: How it was computed, in plain words }
        inputs: { type: object, additionalProperties: { type: number } }
        todaysDollars: { type: number, nullable: true, description: The configured amount before inflation adjustment }

    StartingPosition:
      type: object
      required: [openingBalances, openingTotal, conditions, household]
      properties:
        openingBalances: { $ref: '#/components/schemas/Portfolio' }
        openingTotal: { type: number }
        conditions:
          type: object
          required: [inflationRate, cumulativeInflation, equityReturn, equityReturnSource, presetName, presetSequenceYear, monteCarloRun, bondYield, hysaRate, incomeTaxRate, marketVsAllTimeHigh]
          properties:
            inflationRate: { type: number, description: The rate applied this year (configured, or the Monte Carlo run's sample) }
            cumulativeInflation: { type: number }
            equityReturn: { type: number }
            equityReturnSource: { type: string, enum: [PRE_RETIREMENT_RATE, POST_RETIREMENT_RATE, PRESET_SEQUENCE, MONTE_CARLO_SCENARIO] }
            presetName: { type: string, nullable: true }
            presetSequenceYear: { type: integer, nullable: true }
            monteCarloRun: { type: integer, nullable: true, description: 1-based run number when explaining a Monte Carlo run }
            bondYield: { type: number }
            hysaRate: { type: number }
            incomeTaxRate: { type: number }
            marketVsAllTimeHigh: { type: number }
        household:
          type: object
          required: [healthcareBracket, earners]
          properties:
            healthcareBracket: { type: string, enum: [PRE_RETIREMENT, POST_RETIREMENT_PRE_MEDICARE, MEDICARE] }
            earners:
              type: array
              items:
                type: object
                required: [role, age, claimAge, claiming]
                properties:
                  role: { type: string, enum: [HIGHER, LOWER] }
                  age: { type: integer }
                  claimAge: { type: integer }
                  claiming: { type: boolean }

    ExpenseSection:
      type: object
      required: [items, wantsDerivation, oneTimeExpenses, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        wantsDerivation: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        oneTimeExpenses:
          type: array
          items:
            type: object
            required: [name, type, amount, inflationAdjusted, todaysDollars]
            properties:
              name: { type: string }
              type: { type: string, enum: [CASH, DOWN_PAYMENT, LOAN_PAYMENT] }
              amount: { type: number }
              inflationAdjusted: { type: boolean }
              todaysDollars: { type: number, nullable: true, description: The configured amount; null for loan payments }
        total: { type: number, description: Equals the results-table Total Expenses }

    IncomeSection:
      type: object
      required: [salary, interest, dividends, socialSecurity, incomeTotal, withdrawals, totalIncome, transfers]
      properties:
        salary:
          type: object
          nullable: true
          required: [gross, contribution401k, contributionRoth, contributionTba, takeHome, todaysDollars]
          properties:
            gross: { type: number }
            contribution401k: { type: number }
            contributionRoth: { type: number }
            contributionTba: { type: number }
            takeHome: { type: number }
            todaysDollars:
              type: object
              description: The configured salary and contributions, before inflation adjustment
              required: [gross, contribution401k, contributionRoth, contributionTba]
              properties:
                gross: { type: number }
                contribution401k: { type: number }
                contributionRoth: { type: number }
                contributionTba: { type: number }
        interest: { $ref: '#/components/schemas/LineItem' }
        dividends: { $ref: '#/components/schemas/LineItem' }
        socialSecurity:
          type: array
          items:
            type: object
            required: [role, amount, spousalStepUp, startYear, todaysDollars]
            properties:
              role: { type: string, enum: [HIGHER, LOWER] }
              amount: { type: number }
              spousalStepUp: { type: boolean }
              startYear: { type: integer, nullable: true }
              todaysDollars: { type: number, nullable: true, description: The benefit before inflation adjustment; null while not claiming }
        incomeTotal: { type: number }
        withdrawals: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        totalIncome: { type: number, description: Equals the results-table Total Income }
        transfers: { type: array, items: { $ref: '#/components/schemas/LineItem' }, description: Roth conversions (between accounts, not income) }

    IncomeGapSection:
      type: object
      required: [estimated, actual, differences, capAig, sbFloor, sbCap, cbbCap, cbbCapReductions, thresholds, takeHomeSalary, workingExpenses, explanation]
      properties:
        estimated: { allOf: [{ $ref: '#/components/schemas/GapComputation' }], nullable: true }
        actual: { allOf: [{ $ref: '#/components/schemas/GapComputation' }], nullable: true }
        differences: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        capAig: { allOf: [{ $ref: '#/components/schemas/LineItem' }], nullable: true }
        sbFloor: { allOf: [{ $ref: '#/components/schemas/LineItem' }], nullable: true }
        sbCap: { allOf: [{ $ref: '#/components/schemas/LineItem' }], nullable: true }
        cbbCap: { allOf: [{ $ref: '#/components/schemas/LineItem' }], nullable: true }
        cbbCapReductions: { type: array, items: { type: integer } }
        thresholds:
          type: array
          items:
            type: object
            required: [name, value, evaluated]
            properties:
              name: { type: string }
              value: { type: number }
              evaluated: { type: boolean }
        takeHomeSalary: { allOf: [{ $ref: '#/components/schemas/LineItem' }], nullable: true }
        workingExpenses: { allOf: [{ $ref: '#/components/schemas/LineItem' }], nullable: true }
        explanation: { type: string }

    GapComputation:
      type: object
      required: [expenses, passiveIncome, gap]
      properties:
        expenses: { type: number }
        passiveIncome: { type: number }
        gap: { type: number }

    MoneyMovementSection:
      type: object
      required: [ledgers, flows, quarterStrategy, failure]
      properties:
        ledgers:
          type: array
          description: SB, CBB, TBA, TDA, TFA; closing[q] = opening[q] + sum of rows' amounts[q]
          items:
            type: object
            required: [account, opening, rows, closing]
            properties:
              account: { $ref: '#/components/schemas/Endpoint' }
              opening: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
              rows:
                type: array
                items:
                  type: object
                  required: [type, counterparty, amounts, yearTotal]
                  properties:
                    type: { $ref: '#/components/schemas/MovementType' }
                    counterparty: { $ref: '#/components/schemas/Endpoint' }
                    amounts: { type: array, items: { type: number }, minItems: 4, maxItems: 4, description: + into the account, − out of it }
                    yearTotal: { type: number }
              closing: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        flows:
          type: array
          description: The year's net flow between each pair of endpoints
          items:
            type: object
            required: [from, to, amount]
            properties:
              from: { $ref: '#/components/schemas/Endpoint' }
              to: { $ref: '#/components/schemas/Endpoint' }
              amount: { type: number }
        quarterStrategy:
          type: array
          items:
            type: object
            required: [quarter, rule, marketVs12MonthsPrior, marketVsAllTimeHigh, refillToSb, refillToCbb, limitedBy, cbbRefillLimitedBy, cbbVs12MonthsPrior, cbbLoss, equityLoss, explanation]
            properties:
              quarter: { type: integer, minimum: 1, maximum: 4 }
              rule: { type: string, enum: [MARKET_UP_CBB_FULL, MARKET_UP_CBB_REFILL, MARKET_DOWN_HOLD, MARKET_DOWN_FROM_CBB, MARKET_DOWN_FROM_EQUITIES] }
              marketVs12MonthsPrior: { type: number }
              marketVsAllTimeHigh: { type: number }
              refillToSb: { type: number }
              refillToCbb: { type: number }
              limitedBy: { type: string, enum: [QUARTERLY_SHARE, SB_CAP, SB_FLOOR_DEFICIT, CBB_CAP, AVAILABLE_BALANCE, NONE] }
              cbbRefillLimitedBy: { type: string, nullable: true, enum: [QUARTERLY_SHARE, CBB_CAP, AVAILABLE_BALANCE], description: What limited the CBB refill; null when none was due }
              cbbVs12MonthsPrior: { type: number, nullable: true, description: "Market down with the SB at its floor: CBB balance vs 12 months earlier (#21); null otherwise" }
              cbbLoss: { type: number, nullable: true, description: "CBB cap − CBB balance, when the CBB was below 90% of 12 months earlier; null otherwise" }
              equityLoss: { type: number, nullable: true, description: "What TDA + TBA lost to the market over 12 months, when cbbLoss is set; null otherwise" }
              explanation: { type: string }
        failure:
          type: object
          nullable: true
          required: [quarter, account, condition]
          properties:
            quarter: { type: integer }
            account: { $ref: '#/components/schemas/Endpoint' }
            condition: { type: string }

    Endpoint:
      type: string
      enum: [SB, CBB, TBA, TDA, TFA, SALARY, SOCIAL_SECURITY, BANK, BONDS, EXPENSES, MARKET]

    MovementType:
      type: string
      enum: [INTEREST, DIVIDENDS, TAKE_HOME_SALARY, CONTRIBUTION_401K, CONTRIBUTION_ROTH, CONTRIBUTION_TBA, SOCIAL_SECURITY, REGULAR_EXPENSES, ONE_TIME_EXPENSE, STRATEGY_REFILL, SHORTFALL_COVER, ROTH_CONVERSION, MARKET_GROWTH]

    TaxSection:
      type: object
      required: [billThisYear, generatedThisYear, simplifications]
      properties:
        billThisYear: { $ref: '#/components/schemas/TaxComputation' }
        generatedThisYear: { $ref: '#/components/schemas/TaxComputation' }
        simplifications: { type: array, items: { type: string } }

    TaxComputation:
      type: object
      required: [basis, components, taxableIncome, rate, tax]
      properties:
        basis: { type: string, enum: [PRIOR_YEAR, START_YEAR_ESTIMATE, THIS_YEAR] }
        components:
          type: array
          items:
            type: object
            required: [name, amount, taxedShare, taxable]
            properties:
              name: { type: string }
              amount: { type: number }
              taxedShare: { type: number }
              taxable: { type: number }
        taxableIncome: { type: number }
        rate: { type: number }
        tax: { type: number }

    NextYearSection:
      type: object
      required: [year, age, expenses, income, incomeGap, changes]
      properties:
        year: { type: integer }
        age: { type: integer }
        expenses: { type: array, items: { $ref: '#/components/schemas/ProjectedItem' } }
        income: { type: array, items: { $ref: '#/components/schemas/ProjectedItem' } }
        incomeGap: { allOf: [{ $ref: '#/components/schemas/ProjectedItem' }], nullable: true }
        changes: { type: array, items: { type: string } }

    ProjectedItem:
      type: object
      required: [label, amount, exact, change, rule]
      properties:
        label: { type: string }
        amount: { type: number }
        exact: { type: boolean, description: false for amounts that depend on market returns }
        change: { type: number, description: Difference from this year }
        rule: { type: string, description: How it was computed }

    MarketPreset:
      type: object
      required: [id, name, description, inflation, preRetirementGrowth, postRetirementGrowth, bondYield, retirementReturnSequence]
      properties:
        id: { type: string, example: crash-2008 }
        name: { type: string, example: 2008 Crash }
        description: { type: string }
        inflation: { type: number }
        preRetirementGrowth: { type: number }
        postRetirementGrowth: { type: number }
        bondYield: { type: number }
        retirementReturnSequence:
          type: array
          items: { type: number }
          description: Equity returns for the first retirement years, in order; empty for static rates

    MonteCarloResult:
      type: object
      required: [seed, runCount, method, years, paths, statistics, apiMetadata]
      properties:
        seed: { type: integer, format: int64 }
        runCount: { type: integer }
        method: { type: string, description: How the scenarios were generated, for display }
        years:
          type: array
          items: { type: integer }
          description: The start year through the End Age year; index i of every path and line is years[i]
        paths:
          type: array
          items: { $ref: '#/components/schemas/MonteCarloPath' }
        statistics: { $ref: '#/components/schemas/Statistics' }
        apiMetadata: { $ref: '#/components/schemas/ApiMetadata' }

    MonteCarloPath:
      type: object
      required: [runIndex, totalBalances, isSuccess, failureYear, endingBalance, averageReturn, averageInflation, averageBondYield]
      properties:
        runIndex: { type: integer }
        totalBalances:
          type: array
          items: { type: number }
          description: Total portfolio at the end of each year from the start year; a failed run stops at its failure year
        isSuccess: { type: boolean }
        failureYear: { type: integer, nullable: true }
        endingBalance: { type: number }
        averageReturn: { type: number }
        averageInflation: { type: number }
        averageBondYield: { type: number }
        hadSpendingCut: { type: boolean, nullable: true, description: Risk-Based Guardrails only (spec 006) }

    Statistics:
      type: object
      description: |
        Confidence lines by year, aligned with MonteCarloResult.years. percentileNPath is the balance that
        N% of runs reach or exceed (the 90% line is the most conservative); a failed run counts as 0
        after it fails.
      required: [medianPath, percentile75Path, percentile90Path, successRate]
      properties:
        medianPath: { type: array, items: { type: number } }
        percentile75Path: { type: array, items: { type: number } }
        percentile90Path: { type: array, items: { type: number } }
        successRate: { type: number, minimum: 0, maximum: 1 }
        spending:
          allOf: [{ $ref: '#/components/schemas/SpendingStatistics' }]
          nullable: true
          description: Risk-Based Guardrails only (spec 006, FR006-021)

    SpendingStatistics:
      type: object
      description: Annual spending in today's dollars per year, aligned with MonteCarloResult.years; null for working years
      required: [percentile10Path, medianPath, percentile90Path, shareOfRunsWithCut]
      properties:
        percentile10Path: { type: array, items: { type: number, nullable: true } }
        medianPath: { type: array, items: { type: number, nullable: true } }
        percentile90Path: { type: array, items: { type: number, nullable: true } }
        shareOfRunsWithCut: { type: number, minimum: 0, maximum: 1 }

    MarketScenario:
      type: object
      description: One run's market variables by year; index 0 is the start year (not simulated) and holds the config's rates
      required: [years, equityReturns, inflationRates, bondYields]
      properties:
        years: { type: array, items: { type: integer } }
        equityReturns: { type: array, items: { type: number } }
        inflationRates: { type: array, items: { type: number } }
        bondYields: { type: array, items: { type: number } }

    MonteCarloRunDetail:
      type: object
      required: [seed, path, scenario, result]
      properties:
        seed: { type: integer, format: int64 }
        path: { $ref: '#/components/schemas/MonteCarloPath' }
        scenario: { $ref: '#/components/schemas/MarketScenario' }
        result: { $ref: '#/components/schemas/SimulationResult' }

    SavedSimulationSummary:
      type: object
      required: [id, name, createdAt, updatedAt, isSuccess, failureYear, finalTotalBalance, endAge, version, isCurrentVersion]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time, description: When it was saved, with UTC offset }
        updatedAt: { type: string, format: date-time, nullable: true, description: When inputs and results were last replaced (FR005-007); null if never }
        isSuccess: { type: boolean }
        failureYear: { type: integer, nullable: true }
        finalTotalBalance: { type: number }
        endAge: { type: integer }
        version: { type: string, nullable: true, description: The version that computed the saved results; null if not recorded (FR005-001) }
        isCurrentVersion: { type: boolean, description: True only when version is the running version }

    SavedSimulation:
      type: object
      required: [summary, result, apiMetadata]
      properties:
        summary: { $ref: '#/components/schemas/SavedSimulationSummary' }
        result: { $ref: '#/components/schemas/SimulationResult' }
        apiMetadata: { $ref: '#/components/schemas/ApiMetadata', description: The running server (result.apiMetadata is the one that computed the results) }

    UpdateSimulationRequest:
      type: object
      required: [result]
      properties:
        result: { $ref: '#/components/schemas/SimulationResult' }

    RenameSimulationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Trimmed; 1–255 characters }

    InputsFile:
      type: object
      required: [format, formatVersion, appVersion, config]
      properties:
        format: { type: string, enum: [retirement-simulator-inputs] }
        formatVersion: { type: integer, description: "1; higher versions are refused" }
        appVersion: { type: string, description: The version that wrote the file }
        config: { $ref: '#/components/schemas/SimulationConfig' }

    ValidationErrorResponse:
      type: object
      required: [error, statusCode, validationErrors]
      properties:
        error: { type: string, example: Validation failed }
        statusCode: { type: integer, example: 422 }
        validationErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: 'oneTimeExpenses[0].termYears' }
              message: { type: string }

    ErrorResponse:
      type: object
      required: [error, statusCode]
      properties:
        error: { type: string }
        statusCode: { type: integer }
