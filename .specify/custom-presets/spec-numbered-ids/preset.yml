schema_version: "1.0"

preset:
  id: "spec-numbered-ids"
  name: "Spec-Numbered Identifiers"
  version: "1.0.0"
  description: "Every spec identifier carries its spec number (FR004-050, T004-001, US004-1, CHK004-001), so identifiers are unique across specs"
  author: "retirement-cashflow-simulator"
  license: "MIT"

requires:
  speckit_version: ">=1.1.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "/speckit-specify with spec-numbered identifiers"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "/speckit-tasks with spec-numbered identifiers"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "/speckit-checklist with spec-numbered identifiers"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "/speckit-analyze with spec-numbered identifiers"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "/speckit-converge with spec-numbered identifiers"
      strategy: "wrap"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "spec-template with spec-numbered identifier examples (### = spec number)"
      strategy: "replace"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "tasks-template with spec-numbered identifier examples (### = spec number)"
      strategy: "replace"
    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "checklist-template with spec-numbered identifier examples (### = spec number)"
      strategy: "replace"

tags:
  - "identifiers"
  - "traceability"
