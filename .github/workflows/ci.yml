name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-server:
    name: API server (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Includes ContractTypesTest, which fails if the generated TypeScript types are stale
      - run: ./gradlew test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (Deno BFF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # The Chromium matching the pinned @playwright/test, plus the system libraries it needs on Ubuntu
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # The three services, as in the README's "Running Services"; each keeps running for the later steps
      - name: Start the API server
        working-directory: api-server
        run: nohup ./gradlew run > apiserver.log 2>&1 &
      - name: Start the BFF
        working-directory: backend
        run: nohup deno task start > backend.log 2>&1 &
      - name: Start the frontend
        working-directory: frontend
        run: nohup npm run dev -- --port 5173 --strictPort > frontend.log 2>&1 &
      - name: Wait for the services
        run: |
          for url in http://localhost:8090/ http://localhost:8000/health http://localhost:5173/; do
            for attempt in $(seq 1 90); do
              curl -sf -o /dev/null "$url" && break
              sleep 2
            done
            curl -sf -o /dev/null "$url" || { echo "::error::$url did not start"; exit 1; }
            echo "$url is up"
          done
      - name: Run the end-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: Upload test results and service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            api-server/apiserver.log
            backend/backend.log
            frontend/frontend.log
          if-no-files-found: ignore
